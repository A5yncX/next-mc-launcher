[package]
name = "mc-login"
version = "0.1.0"
edition = "2021"
description = "Microsoft account sign-in for Minecraft, written against Horizon's launcher flow, without the launcher"
license = "MIT"

[dependencies]
ureq = { version = "2", features = ["json", "tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
